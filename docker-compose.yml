version: "3.9"

services:
  remote-command-plot:
    build:
      context: .
      dockerfile: Dockerfile
    image: remote-command-plot:latest
    container_name: remote-command-plot
    ports:
      - "${APP_PORT}:8000"
    env_file:
      - .env
    environment:
      APP_HOST: ${APP_HOST}
      APP_PORT: ${APP_PORT}
      APP_RELOAD: ${APP_RELOAD}
      LOG_FILE: ${LOG_FILE}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped